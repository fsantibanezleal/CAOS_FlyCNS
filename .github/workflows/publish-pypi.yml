name: publish-pypi

# The filename matters: PyPI's trusted-publisher claim includes the workflow FILE NAME, registered as
# publish-pypi.yml. Renaming this file breaks publishing with an invalid-publisher error.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write   # OIDC; no API token is stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag, the VERSION file and both manifests agree
        run: |
          set -euo pipefail
          file_version="$(tr -d ' \r\n' < VERSION)"
          manifest_version="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          npm_version="$(python -c "import json;print(json.load(open('package.json'))['version'])")"
          expected="$(python -c "print('.'.join(str(int(p)) for p in '${file_version}'.split('.')))")"
          echo "VERSION=${file_version} pyproject=${manifest_version} npm=${npm_version} expected=${expected}"
          test "${manifest_version}" = "${expected}"
          test "${npm_version}" = "${expected}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${file_version}"
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
